name: Build main target

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - Podfile
      - NextcloudTalk.xcodeproj/**
      - NextcloudTalk/**
      - NextcloudTalkTests/**
      - NotificationServiceExtension/**
      - ShareExtension/**
      - BroadcastUploadExtension/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The self-hosted runner service starts without a locale; CocoaPods crashes on a non-UTF-8 one.
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  WORKSPACE: NextcloudTalk.xcworkspace
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=27.2
  SIMULATOR_MODEL: iPhone 17
  SIMULATOR_VERSION: "27.2"
  SCHEME: NextcloudTalk
  XCODE_VERSION: "27.2"

jobs:
  build:
    name: Build
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      # Workaround for eliminating iOS 17 simulators stalling issue
      # Runs deamon which kills CPU intensive tasks which affects simulator performance
      # See https://github.com/actions/runner-images/issues/11509#issuecomment-2703308482
    - name: Install and run yeetd
      # Hosted-image workaround; it installs a root daemon, so never on the self-hosted Mac Mini.
      if: runner.environment == 'github-hosted'
      run: |
        wget https://github.com/biscuitehh/yeetd/releases/download/1.0/yeetd-normal.pkg
        sudo installer -pkg yeetd-normal.pkg -target /
        defaults write dev.biscuit.yeetd killapsd true
        yeetd & 
            
    - name: Checkout app
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: true

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    # setup-cocoapods uninstalls and reinstalls CocoaPods on every run, which on the
    # self-hosted Mac Mini would change the machine (and needs root). Use the installed
    # pod, or install it once through Homebrew (macOS's own Ruby 2.6 is too old for it).
    - name: Setup Cocoapods
      run: |
        # The runner service's PATH does not include Homebrew; add it for this and later steps.
        for d in /opt/homebrew/bin /usr/local/bin; do
          if [ -x "$d/brew" ]; then export PATH="$d:$PATH"; echo "$d" >> "$GITHUB_PATH"; break; fi
        done
        if ! command -v pod >/dev/null 2>&1; then
          if ! command -v brew >/dev/null 2>&1; then
            echo "::error::CocoaPods is not installed on this runner and Homebrew was not found. Install CocoaPods on the Mac Mini for the runner user."
            exit 1
          fi
          brew install cocoapods
        fi
        pod --version

    - name: Set up dependencies talk-ios
      run: |
        pod install

    - name: Setup Xcode ${{ env.XCODE_VERSION }}
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Make sure xcbeautify is available
      run: |
        # The self-hosted Mac Mini may not have xcbeautify. Fall back to plain output instead of failing.
        if ! command -v xcbeautify >/dev/null 2>&1; then
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\ncat\n' > "$RUNNER_TEMP/bin/xcbeautify"
          chmod +x "$RUNNER_TEMP/bin/xcbeautify"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "xcbeautify not installed on this runner; using plain xcodebuild output"
        fi

    - name: Build NextcloudTalk iOS for testing
      run: |
        set -o pipefail && \
        xcodebuild build-for-testing \
        -workspace '${{ env.WORKSPACE }}' \
        -scheme '${{ env.SCHEME }}' \
        -destination '${{ env.DESTINATION }}' \
        -derivedDataPath 'DerivedData' \
        | xcbeautify --quieter

    - name: Upload test build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: Products
        path: DerivedData/Build/Products
        retention-days: 4

  test:
    name: Test
    runs-on: [self-hosted, macOS, ARM64]
    needs: [build]

    strategy:
      fail-fast: false
      # One Mac Mini: run the server configs one after another.
      max-parallel: 1
      matrix:
        # Test with stable23 as well to find regressions in older versions
        configs: [
          {
            serverbranch: 'stable23',
            talkbranch: 'stable23',
            notificationsbranch: 'stable23',
            phpversion: '8.0'
          },
          {
            serverbranch: 'stable32',
            talkbranch: 'stable32',
            notificationsbranch: 'stable32',
            phpversion: '8.3'
          },
          {
            serverbranch: 'stable33',
            talkbranch: 'stable33',
            notificationsbranch: 'stable33',
            phpversion: '8.3'
          },
          {
            serverbranch: 'stable34',
            talkbranch: 'stable34',
            notificationsbranch: 'stable34',
            phpversion: '8.3'
          },
          {
            serverbranch: 'master',
            talkbranch: 'main',
            notificationsbranch: 'master',
            phpversion: '8.3'
          }
        ]

    steps:
      # Workaround for eliminating iOS 17 simulators stalling issue
      # Runs deamon which kills CPU intensive tasks which affects simulator performance
      # See https://github.com/actions/runner-images/issues/11509#issuecomment-2703308482
    - name: Install and run yeetd
      # Hosted-image workaround; it installs a root daemon, so never on the self-hosted Mac Mini.
      if: runner.environment == 'github-hosted'
      run: |
        wget https://github.com/biscuitehh/yeetd/releases/download/1.0/yeetd-normal.pkg
        sudo installer -pkg yeetd-normal.pkg -target /
        defaults write dev.biscuit.yeetd killapsd true
        yeetd & 

    - name: Checkout app
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: true

    - name: Put Homebrew on PATH
      # The runner service's PATH does not include Homebrew, which the PHP setup needs.
      run: |
        for d in /opt/homebrew/bin /usr/local/bin; do
          if [ -x "$d/brew" ]; then echo "$d" >> "$GITHUB_PATH"; exit 0; fi
        done
        echo "::error::Homebrew was not found on this runner; PHP setup needs it."
        exit 1

    - name: Set up php ${{ matrix.configs.phpversion }} (self-hosted)
      # setup-php hides Homebrew's output and failed silently on the Mac Mini VMs.
      # Install the same PHP builds (shivammathur tap) directly so errors are visible.
      if: runner.environment != 'github-hosted'
      run: |
        V='${{ matrix.configs.phpversion }}'
        brew tap shivammathur/php
        brew tap shivammathur/extensions
        brew install "shivammathur/php/php@$V" "shivammathur/extensions/apcu@$V" composer
        PREFIX="$(brew --prefix "shivammathur/php/php@$V")"
        echo "$PREFIX/sbin" >> "$GITHUB_PATH"
        echo "$PREFIX/bin" >> "$GITHUB_PATH"
        SCAN_DIR="$("$PREFIX/bin/php" -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')"
        printf 'apc.enable_cli=1\ndisable_functions=\n' > "$SCAN_DIR/zz-xenia-ci.ini"
        "$PREFIX/bin/php" -v
        for ext in apcu pdo_sqlite sqlite3 intl gd zip mbstring pcntl posix; do
          "$PREFIX/bin/php" -m | grep -qix "$ext" || { echo "::error::PHP extension $ext is missing"; exit 1; }
        done

    - name: Set up php ${{ matrix.configs.phpversion }}
      if: runner.environment == 'github-hosted'
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: ${{ matrix.configs.phpversion }}
        # https://docs.nextcloud.com/server/stable/admin_manual/installation/source_installation.html#prerequisites-for-manual-installation
        extensions: apcu, bz2, ctype, curl, dom, fileinfo, gd, iconv, intl, json, libxml, mbstring, openssl, pcntl, posix, session, simplexml, xmlreader, xmlwriter, zip, zlib, pgsql, pdo_pgsql
        coverage: none
        ini-file: development
        # Temporary workaround for missing pcntl_* in PHP 8.3: ini-values: apc.enable_cli=on
        ini-values: apc.enable_cli=on, disable_functions=
      env:
        fail-fast: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout server
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: true
        repository: nextcloud/server
        path: server
        ref: ${{ matrix.configs.serverbranch }}

    - name: Checkout Talk
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: nextcloud/spreed
        path: server/apps/spreed
        ref: ${{ matrix.configs.talkbranch }}

    - name: Checkout notifications app
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: nextcloud/notifications
        path: server/apps/notifications
        ref: ${{ matrix.configs.notificationsbranch }}

    - name: Set up production dependencies spreed
      working-directory: server/apps/spreed
      run: composer i --no-dev

    - name: Set up production dependencies notifications
      working-directory: server/apps/notifications
      run: composer i --no-dev 

    - name: Set up Nextcloud
      run: |
        mkdir server/data
        ./server/occ maintenance:install --verbose --database=sqlite --admin-user admin --admin-pass admin --admin-email admin@local.invalid
        ./server/occ config:system:set hashing_default_password --value=true --type=boolean
        ./server/occ config:system:set auth.bruteforce.protection.enabled --value false --type bool
        ./server/occ config:system:set ratelimit.protection.enabled --value false --type bool
        ./server/occ config:system:set memcache.local --value='\OC\Memcache\APCu'
        ./server/occ config:system:set memcache.distributed --value='\OC\Memcache\APCu'
        ./server/occ app:enable --force spreed
        ./server/occ app:enable --force notifications
        ./server/occ background:cron
        ./server/occ talk:bot:install TestBot secret123456789123456789qwertzuiop1234567890 https://domain.invalid "New description" || true
        OC_PASS=alice ./server/occ user:add --password-from-env alice
        # 10 concurrent PHP workers against a single SQLite-backed server caused
        # "database is locked" (SQLSTATE[HY000] error 5) under -test-iterations 3,
        # cascading into login/room-list test failures (XNT-240). SQLite serializes
        # writers; fewer workers means fewer overlapping writes hitting that lock.
        PHP_CLI_SERVER_WORKERS=2 php -S localhost:8080 -t server/ &

    - name: Download test-build
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: Products

    - name: Check status.php
      run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors http://localhost:8080/status.php | grep -q '"installed":true'

    - name: Setup test-specific rooms
      run: |
        source ./ci-setup-rooms.sh

    - name: Setup Xcode ${{ env.XCODE_VERSION }}
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Boot simulator
      uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5 # v5.0.0
      with:
        model: ${{ env.SIMULATOR_MODEL }}
        os_version: ${{ env.SIMULATOR_VERSION }}
        wait_for_boot: true

    - name: Test NextcloudTalk iOS
      run: |
        xcrun simctl privacy booted grant camera eu.xeniacloud.talk

        set -o pipefail && \
        xcodebuild test-without-building \
        -xctestrun $(find . -type f -name '*.xctestrun') \
        -destination '${{ env.DESTINATION }}' \
        -derivedDataPath 'DerivedData' \
        -test-iterations 3 \
        -retry-tests-on-failure \
        -resultBundlePath 'testResult.xcresult'

    - name: Parse test results with xcresultparser & xctesthtmlreport
      if: ${{ !cancelled() }}
      run: |
        for d in /opt/homebrew/bin /usr/local/bin; do
          if [ -x "$d/brew" ]; then export PATH="$d:$PATH"; break; fi
        done
        brew install xcresultparser xctesthtmlreport
        xcresultparser -o cli testResult.xcresult
        xchtmlreport -i -z testResult.xcresult
        mv index.html testResults-${{ matrix.configs.talkbranch }}.html        

    - name: Upload result page from xchtmlresult
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ !cancelled() }}
      with:
        path: 'testResults-${{ matrix.configs.talkbranch }}.html'
        archive: false # This ignores the name parameter, therefore we rename in the create step

    - name: Print logs
      if: ${{ !cancelled() }}
      run: |
        cat server/data/nextcloud.log

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: ${{ !cancelled() }}
      with:
        name: testResults-${{ matrix.configs.talkbranch }}.xcresult
        path: 'testResult.xcresult'

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: [test]

    if: always()

    name: build-and-test-summary

    steps:
      - name: Summary status
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: '[ "$TEST_RESULT" = "success" ]'