# XeniaCloud CI — unsigned build verification for the xenia-rebrand fork.
# XNT-50. Build-only (no test matrix, no signing) — deliberately narrower than
# upstream's talk-ios-tests.yml, which also runs a 5-config server test matrix.

name: Xenia CI (unsigned build)

# XNT-215: until 26 Sep 2026 this was `workflow_dispatch:` only, so `main` had no
# build check at all — 8 runs ever, all on feature branches, zero on the default
# branch. main HEAD had never been compiled by CI, and upstream's
# talk-ios-tests.yml is `pull_request:`-only, so it could not cover the gap.
#
# No `paths:` filter here, deliberately. This job is meant to become a required
# status check, and a required check that does not run is indistinguishable from
# one that is still pending: GitHub blocks the PR forever rather than passing it.
# A `paths:`-filtered required check is therefore a trap, and so is a push-only
# one. The cost is that every PR compiles even when only docs changed; that is
# the price of a signal that cannot silently go missing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The self-hosted runner service starts without a locale; CocoaPods crashes on a non-UTF-8 one.
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  WORKSPACE: NextcloudTalk.xcworkspace
  SCHEME: NextcloudTalk
  XCODE_VERSION: "27.2"

jobs:
  build:
    name: Build (unsigned)
    runs-on: [self-hosted, macOS, ARM64]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: true

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: Pods
        key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-pods-

    # setup-cocoapods uninstalls and reinstalls CocoaPods on every run, which on the
    # self-hosted Mac Mini would change the machine (and needs root). Use the installed
    # pod, or install it once through Homebrew (macOS's own Ruby 2.6 is too old for it).
    - name: Setup Cocoapods
      run: |
        # The runner service's PATH does not include Homebrew; add it for this and later steps.
        for d in /opt/homebrew/bin /usr/local/bin; do
          if [ -x "$d/brew" ]; then export PATH="$d:$PATH"; echo "$d" >> "$GITHUB_PATH"; break; fi
        done
        if ! command -v pod >/dev/null 2>&1; then
          if ! command -v brew >/dev/null 2>&1; then
            echo "::error::CocoaPods is not installed on this runner and Homebrew was not found. Install CocoaPods on the Mac Mini for the runner user."
            exit 1
          fi
          brew install cocoapods
        fi
        pod --version

    - name: Install pods
      run: pod install

    - name: Setup Xcode ${{ env.XCODE_VERSION }}
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: ${{ env.XCODE_VERSION }}

    - name: Make sure xcbeautify is available
      run: |
        # The self-hosted Mac Mini may not have xcbeautify. Fall back to plain output instead of failing.
        if ! command -v xcbeautify >/dev/null 2>&1; then
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\ncat\n' > "$RUNNER_TEMP/bin/xcbeautify"
          chmod +x "$RUNNER_TEMP/bin/xcbeautify"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "xcbeautify not installed on this runner; using plain xcodebuild output"
        fi

    - name: Build (unsigned, simulator SDK)
      run: |
        set -o pipefail && \
        xcodebuild build \
        -workspace "${{ env.WORKSPACE }}" \
        -scheme "${{ env.SCHEME }}" \
        -destination 'generic/platform=iOS Simulator' \
        -derivedDataPath 'DerivedData' \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        | xcbeautify --quieter

    - name: Locate built .app
      run: find DerivedData/Build/Products -maxdepth 2 -type d -name "*.app"

    - name: Upload built .app
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: NextcloudTalk-app
        path: DerivedData/Build/Products/**/*.app
