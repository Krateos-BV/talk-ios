# XeniaCloud release pipeline — XNT-213.
#
# Builds a signed archive, exports an .ipa, and uploads it to App Store
# Connect / TestFlight. Triggered on version tags only (v*), so it never
# runs on ordinary pushes/PRs — unlike xenia-ci.yml (XNT-50), which is the
# unsigned build-verification workflow this one is modeled after.
#
# Secrets referenced below come from the naming convention established in
# XNT-207. As of this writing none of them exist yet in this repo; they are
# expected to land in Infisical and then GitHub Actions secrets separately.
# See the XNT-213 Jira comment for open questions about this secret list
# (in particular: no provisioning-profile secret is defined yet).

name: Xenia Release (signed archive + TestFlight upload)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build and export only, skip the App Store Connect upload'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  WORKSPACE: NextcloudTalk.xcworkspace
  SCHEME: NextcloudTalk
  # Same Xcode version xenia-ci.yml and talk-ios-tests.yml pin today. talk-ios
  # has NOT shown the xcode-27 requirement that files-ios has (XNT-229) — its
  # CI workflows all run on macos-26 with Xcode 26.5 and build/test cleanly
  # there. If that changes (e.g. a future SDK bump forces Xcode 27), this
  # value and the runner label below need to move together with xenia-ci.yml.
  XCODE_VERSION: "26.5"
  ARCHIVE_PATH: DerivedData/NextcloudTalk.xcarchive
  EXPORT_PATH: DerivedData/export
  KEYCHAIN_NAME: xenia-release.keychain-db

jobs:
  release:
    name: Archive, export, and upload
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Setup Cocoapods
        uses: maxim-lobanov/setup-cocoapods@8e97e1e98e6ccf42564fdf5622c8feec74199377 # v1.4.0
        with:
          version: latest

      - name: Install pods
        run: pod install

      - name: Setup Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # --- Signing identity: import the distribution certificate into a
      # temporary, job-scoped keychain so it never touches the runner's
      # default login keychain and is gone whether or not the job succeeds.
      - name: Import distribution certificate into a temporary keychain
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/dist_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/${{ env.KEYCHAIN_NAME }}"

          echo "$APPLE_DIST_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_DIST_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      # --- Provisioning profile.
      #
      # NOTE (XNT-213 open question): the XNT-207 secret list has no
      # provisioning-profile secret. Manual signing with xcodebuild needs an
      # actual .mobileprovision installed in
      # ~/Library/MobileDevice/Provisioning\ Profiles/ for EVERY signed
      # target — NextcloudTalk, NotificationServiceExtension, ShareExtension,
      # BroadcastUploadExtension, and TalkIntents (see their .entitlements
      # files) — that's up to 5 distinct App Store profiles, not one.
      #
      # Two ways to close this gap, either needs a decision + a secret add:
      #   (a) add one base64 secret per profile (e.g. APPLE_PROVISIONING_PROFILE_<TARGET>)
      #       and install each with `security cms -D` / a copy into the
      #       Provisioning Profiles directory; or
      #   (b) switch to Xcode-managed ("automatic") signing driven only by
      #       APPLE_TEAM_ID, which needs no profile secrets at all but
      #       requires the runner to authenticate to the Apple Developer
      #       portal (App Store Connect API key can drive this via
      #       `xcodebuild -allowProvisioningUpdates` with
      #       -authenticationKeyPath/-authenticationKeyID/-authenticationKeyIssuerID).
      #
      # This workflow assumes (b) below since it needs no new secret beyond
      # what XNT-207 already lists. If manual/fastlane match profiles are
      # preferred instead, this step must be replaced and profile secrets
      # added to XNT-207's list.
      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (signed, automatic signing via ASC API key)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail && \
          xcodebuild archive \
            -workspace "${{ env.WORKSPACE }}" \
            -scheme "${{ env.SCHEME }}" \
            -archivePath "${{ env.ARCHIVE_PATH }}" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath 'DerivedData' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            | xcbeautify --quieter

      # --- Manually-created App Store distribution profiles.
      #
      # Cloud Managed Signing can create a Development-type profile via the
      # ASC API key (that's what Archive above uses), but cannot create a
      # genuine "iOS App Store" distribution profile that way -- every
      # attempt at automatic export signing failed with "Cloud signing
      # permission error", regardless of certificate validity or quota.
      # These 5 App Store profiles were created manually in the portal
      # (a one-time, human action) and are installed here so Export can
      # reference them explicitly instead of asking Apple to create one on
      # the fly.
      - name: Install App Store provisioning profiles
        env:
          APPLE_PROFILE_TALK: ${{ secrets.APPLE_PROFILE_TALK }}
          APPLE_PROFILE_TALK_INTENTS: ${{ secrets.APPLE_PROFILE_TALK_INTENTS }}
          APPLE_PROFILE_TALK_BROADCASTUPLOAD: ${{ secrets.APPLE_PROFILE_TALK_BROADCASTUPLOAD }}
          APPLE_PROFILE_TALK_SHARE: ${{ secrets.APPLE_PROFILE_TALK_SHARE }}
          APPLE_PROFILE_TALK_NOTIFICATIONSERVICE: ${{ secrets.APPLE_PROFILE_TALK_NOTIFICATIONSERVICE }}
        run: |
          set -euo pipefail
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          install_profile() {
            local name="$1" b64="$2"
            local tmp_profile tmp_plist uuid
            tmp_profile=$(mktemp)
            tmp_plist=$(mktemp)
            echo "$b64" | base64 --decode > "$tmp_profile"
            security cms -D -i "$tmp_profile" > "$tmp_plist"
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$tmp_plist")
            cp "$tmp_profile" "$PROFILES_DIR/$uuid.mobileprovision"
            rm -f "$tmp_profile" "$tmp_plist"
            echo "Installed $name -> $uuid.mobileprovision"
          }

          install_profile "Xenia Talk App Store" "$APPLE_PROFILE_TALK"
          install_profile "Xenia Talk Intents App Store" "$APPLE_PROFILE_TALK_INTENTS"
          install_profile "Xenia Talk BroadcastUploadExtension App Store" "$APPLE_PROFILE_TALK_BROADCASTUPLOAD"
          install_profile "Xenia Talk ShareExtension App Store" "$APPLE_PROFILE_TALK_SHARE"
          install_profile "Xenia Talk NotificationServiceExtension App Store" "$APPLE_PROFILE_TALK_NOTIFICATIONSERVICE"

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>eu.xeniacloud.talk</key>
              <string>Xenia Talk App Store</string>
              <key>eu.xeniacloud.talk.TalkIntents</key>
              <string>Xenia Talk Intents App Store</string>
              <key>eu.xeniacloud.talk.BroadcastUploadExtension</key>
              <string>Xenia Talk BroadcastUploadExtension App Store</string>
              <key>eu.xeniacloud.talk.ShareExtension</key>
              <string>Xenia Talk ShareExtension App Store</string>
              <key>eu.xeniacloud.talk.NotificationServiceExtension</key>
              <string>Xenia Talk NotificationServiceExtension App Store</string>
            </dict>
          </dict>
          </plist>
          PLIST
          echo "EXPORT_OPTIONS_PATH=$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_ENV"

      - name: Export .ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail && \
          xcodebuild -exportArchive \
            -archivePath "${{ env.ARCHIVE_PATH }}" \
            -exportPath "${{ env.EXPORT_PATH }}" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --quieter

      - name: Locate exported .ipa
        run: find "${{ env.EXPORT_PATH }}" -maxdepth 1 -type f -name "*.ipa"

      - name: Upload .ipa build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NextcloudTalk-ipa
          path: ${{ env.EXPORT_PATH }}/*.ipa
          retention-days: 14

      - name: Upload to App Store Connect / TestFlight
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "${{ env.EXPORT_PATH }}" -maxdepth 1 -type f -name "*.ipa" | head -n1)
          if [ -z "$IPA_PATH" ]; then
            echo "No .ipa found in ${{ env.EXPORT_PATH }}" >&2
            exit 1
          fi

          # altool has no flag for an arbitrary key path -- it only looks in a fixed
          # set of default locations, none of which is $RUNNER_TEMP (where the earlier
          # "Prepare App Store Connect API key" step wrote the key for xcodebuild's
          # -authenticationKeyPath). Mirror it into one altool actually searches.
          mkdir -p "$HOME/private_keys"
          cp "$ASC_KEY_PATH" "$HOME/private_keys/"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Clean up temporary keychain and API key
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$ASC_KEY_PATH" || true
